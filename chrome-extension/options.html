<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RG Aide — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>⚙️ RG Aide Settings</h1>

    <div class="field">
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" placeholder="sk-or-v1-xxxxxxxxxxxx" autocomplete="off">
      <p class="hint">
        Get a free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>
      </p>
    </div>

    <div class="actions">
      <button id="saveBtn">Save</button>
      <button id="clearBtn" class="btn-danger">Clear Key</button>
      <span id="status" class="status"></span>
    </div>

    <p class="footer">🔒 Key stored locally. Only sent to AI provider for inference.</p>
  </div>

  <script src="options.js"></script>
</body>
</html>
